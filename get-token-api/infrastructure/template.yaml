AWSTemplateFormatVersion: '2010-09-09'
Description: 'IVS RealTime Token Generator with Geo-blocking and Origin Check at API Gateway Level'

Parameters:
  StageArn:
    Type: String
    Description: ARN of the IVS RealTime Stage
    Default: 'arn:aws:ivs:us-east-1:385085470441:stage/Lem70VypWv33'
  
  AllowedOrigins:
    Type: String
    Description: Allowed origin (e.g., http://localhost:3000)
    Default: 'http://localhost:3000'
  
  AllowedCountries:
    Type: CommaDelimitedList
    Description: Comma-separated list of allowed country codes (e.g., US,HK)
    Default: 'HK'

Resources:
  # WAF Web ACL for Geo-blocking and Origin Check
  TokenApiWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: IVSTokenAPIWebACL
      Scope: REGIONAL
      DefaultAction:
        Block: {}
      Rules:
        # Rule 1: Allow OPTIONS for CORS preflight (must be first)
        - Name: AllowOptionsMethod
          Priority: 1
          Statement:
            ByteMatchStatement:
              SearchString: OPTIONS
              FieldToMatch:
                Method: {}
              TextTransformations:
                - Priority: 0
                  Type: NONE
              PositionalConstraint: EXACTLY
          Action:
            Allow: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AllowOptionsMethod
        
        # Rule 2: Combined Geo-blocking AND Origin Check (both must pass)
        - Name: GeoAndOriginCheckRule
          Priority: 2
          Statement:
            AndStatement:
              Statements:
                # Check 1: Country must be in allowed list
                - GeoMatchStatement:
                    CountryCodes: !Ref AllowedCountries
                # Check 2: Origin must match exactly
                - ByteMatchStatement:
                    SearchString: !Ref AllowedOrigins
                    FieldToMatch:
                      SingleHeader:
                        Name: origin
                    TextTransformations:
                      - Priority: 0
                        Type: LOWERCASE
                    PositionalConstraint: EXACTLY
          Action:
            Allow: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: GeoAndOriginCheckRule
      
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: IVSTokenAPIWebACL

  # Lambda Execution Role
  TokenGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IVSRealTimeTokenPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ivs:CreateParticipantToken
                Resource: !Ref StageArn

  # Lambda Function
  TokenGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: IVSTokenGenerator
      Runtime: nodejs20.x
      Handler: tokenGenerator.handler
      Role: !GetAtt TokenGeneratorRole.Arn
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return {
              statusCode: 200,
              body: JSON.stringify({ message: 'Please deploy with actual code' })
            };
          };
      Environment:
        Variables:
          STAGE_ARN: !Ref StageArn
      Timeout: 30
      MemorySize: 256

  # Lambda Permission for API Gateway
  TokenGeneratorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TokenGeneratorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TokenApi}/*'

  # API Gateway REST API
  TokenApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: IVSTokenAPI
      Description: API for generating IVS RealTime tokens with geo-blocking
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource
  TokenResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TokenApi
      ParentId: !GetAtt TokenApi.RootResourceId
      PathPart: token

  # API Gateway Method - POST
  TokenMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TokenApi
      ResourceId: !Ref TokenResource
      HttpMethod: POST
      AuthorizationType: NONE
      RequestParameters:
        method.request.header.Origin: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TokenGeneratorFunction.Arn}/invocations'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway Method - OPTIONS (for CORS)
  TokenOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TokenApi
      ResourceId: !Ref TokenResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway Deployment
  TokenApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - TokenMethod
      - TokenOptionsMethod
    Properties:
      RestApiId: !Ref TokenApi

  # API Gateway Stage
  TokenApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TokenApi
      DeploymentId: !Ref TokenApiDeployment
      StageName: prod
      Description: Production stage with WAF protection
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true

  # Associate WAF with API Gateway Stage
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${TokenApi}/stages/${TokenApiStage}'
      WebACLArn: !GetAtt TokenApiWebACL.Arn

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${TokenApi}.execute-api.${AWS::Region}.amazonaws.com/prod/token'
    Export:
      Name: IVSTokenApiEndpoint
  
  WebACLArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt TokenApiWebACL.Arn
    Export:
      Name: IVSTokenWebACLArn
  
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt TokenGeneratorFunction.Arn
    Export:
      Name: IVSTokenGeneratorFunctionArn
  
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref TokenGeneratorFunction
    Export:
      Name: IVSTokenGeneratorFunctionName
